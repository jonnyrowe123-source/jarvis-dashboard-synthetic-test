name: Synthetic dashboard source tests
on:
  push:
    paths:
      - 'prototype/**'
      - '.github/workflows/synthetic-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic-only tests
        run: node --test prototype/*.test.mjs

  browser-acceptance:
    if: github.ref == 'refs/heads/vision/fr-gl03-20-synthetic-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium acceptance
        run: node prototype/browser-acceptance.mjs
      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-preview-browser
          path: synthetic-preview-acceptance.png
          if-no-files-found: ignore
