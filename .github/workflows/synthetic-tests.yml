name: Synthetic dashboard source tests
on:
  push:
    paths:
      - 'prototype/**'
      - '.github/workflows/synthetic-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic-only tests
        run: node --test prototype/*.test.mjs
