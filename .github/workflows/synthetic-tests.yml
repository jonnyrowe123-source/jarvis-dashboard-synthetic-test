name: Synthetic dashboard source tests
on:
  push:
    paths:
      - 'prototype/**'
      - '.github/workflows/synthetic-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked OIDC prototype dependency on this integration branch
        if: github.ref == 'refs/heads/vision/fr-gl03-22-oidc-synthetic-integration'
        working-directory: FR-GL03-19/source
        run: npm ci --ignore-scripts
      - name: Install OIDC prototype dependencies on this isolated acceptance branch
        if: github.ref == 'refs/heads/vision/fr-gl03-25-versioned-independent-acceptance'
        working-directory: FR-GL03-19/source
        run: npm ci --ignore-scripts
      - name: Install versioned candidate dependencies on this isolated acceptance branch
        if: github.ref == 'refs/heads/vision/fr-gl03-25-versioned-independent-acceptance'
        working-directory: FR-GL03-23/source
        run: npm ci --ignore-scripts
      - name: Run synthetic-only tests
        run: node --test prototype/*.test.mjs
