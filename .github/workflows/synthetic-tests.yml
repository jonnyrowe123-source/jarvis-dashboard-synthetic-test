name: Synthetic dashboard source tests
on:
  push:
    paths:
      - 'prototype/**'
      - '.github/workflows/synthetic-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked OIDC dependency when synthetic integration tests exist
        if: hashFiles('FR-GL03-19/source/package-lock.json') != ''
        working-directory: FR-GL03-19/source
        run: npm ci --ignore-scripts
      - name: Run synthetic-only tests
        run: node --test prototype/*.test.mjs
