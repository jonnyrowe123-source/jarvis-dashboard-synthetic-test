name: FR-GL03-26A authorization hardening regression
on:
  push:
    branches: [vision/fr-gl03-26a-authorization-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record exact candidate commit
        run: git rev-parse HEAD
      - name: Install locked synthetic dependencies
        run: |
          npm ci --ignore-scripts --prefix FR-GL03-23/source
          npm ci --ignore-scripts --prefix FR-GL03-19/source
      - name: Preserved hardened API regression
        run: npm test --prefix FR-GL03-12/source
      - name: Versioned API regression
        run: npm test --prefix FR-GL03-23/source
      - name: Preserved OIDC regression
        run: npm test --prefix FR-GL03-19/source
      - name: Full Vision prototype regression including GL03-25 and GL03-26A
        run: node --test prototype/*.test.mjs
      - name: Install isolated browser acceptance dependency
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Preserve GL03-25 real Chromium acceptance
        run: node prototype/fr23-browser-acceptance.mjs
      - name: Upload GL03-25 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr26a-inherited-gl03-25-browser
          path: fr-gl03-25-versioned-browser.png
          if-no-files-found: ignore
