name: FR-GL03-24 mobile and keyboard acceptance
on:
  push:
    branches: [vision/fr-gl03-24-accessibility]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node prototype/mobile-keyboard-acceptance.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-mobile-accessibility
          path: synthetic-mobile-accessibility.png
          if-no-files-found: ignore
